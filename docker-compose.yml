
networks:
  appnet:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HotelSite"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./HotelSiteBackend  # Set the context to the directory containing the Dockerfile
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: "production"
      PORT: "8000"
      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/static
    networks: [appnet]
    expose:
      - "8000"
    command: >
      sh -c "
       mkdir -p /app/static/rooms /app/static/pages &&
       echo 'Static folders ensured' &&
       node scripts/bootstrapDatabase.js &&
       node index.js
      "

  frontend:
    build:
     context: ./hotel-project
     dockerfile: Dockerfile
     args:
      REACT_APP_API_URL: ""
      # image: ghcr.io/povid1o/hotelsitetailwind-frontend:latest
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ""
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
      CI: "false"
    networks: [appnet]
    expose:
      - "80"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/var/www/static:ro
    depends_on:
      - frontend
      - backend
    networks: [appnet]
