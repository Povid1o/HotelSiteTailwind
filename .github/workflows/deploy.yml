name: Build & Deploy (GHCR -> VPS)

on:
  push:
    branches: ["dev"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/povid1o/hotelsitetailwind-backend
  IMAGE_FRONTEND: ghcr.io/povid1o/hotelsitetailwind-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BACKEND образ
      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./HotelSiteBackend
          file: ./HotelSiteBackend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FRONTEND образ (без prod-сборки, как мы договорились — dev-сервер внутри)
      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-project
          file: ./hotel-project/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=/api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (login GHCR + compose pull/up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}        # например: root или deploy
          key: ${{ secrets.SSH_KEY }}              # приватный ed25519 ключ (-----BEGIN OPENSSH PRIVATE KEY-----)
          port: ${{ secrets.SSH_PORT }}            # 22 если не менял
          script: |
            set -e
            # логин в GHCR, чтобы сервер мог тянуть приватные образы
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            cd /root/HotelSiteTailwind || cd ~/HotelSiteTailwind

            # тянем новые теги и поднимаем
            docker compose pull
            docker compose up -d

            # чистим висящие слои
            docker image prune -f

