name: Build & Deploy (GHCR -> VPS)

on:
  push:
    branches: ["dev"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/povid1o/hotelsitetailwind-backend
  IMAGE_FRONTEND: ghcr.io/povid1o/hotelsitetailwind-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BACKEND image
      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./HotelSiteBackend
          file: ./HotelSiteBackend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FRONTEND image
      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-project
          file: ./hotel-project/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }}
          # ВНИМАНИЕ: выбери один вариант baseURL
          # Вариант 1: фронт шлёт '/rooms' (без 'api/') → baseURL=/api
          build-args: |
            REACT_APP_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: hotelsite-deploy
      cancel-in-progress: true
    steps:
      - name: Deploy via SSH (compose pull + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd HotelSiteTailwind

            # login to GHCR if images are private
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

