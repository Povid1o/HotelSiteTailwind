name: Build & Deploy (GHCR -> VPS native SSH)

on:
  push:
    branches: ["dev"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/povid1o/hotelsitetailwind-backend
  IMAGE_FRONTEND: ghcr.io/povid1o/hotelsitetailwind-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image
      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./HotelSiteBackend
          file: ./HotelSiteBackend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      # Frontend image (dev-сервер внутри контейнера)
      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-project
          file: ./hotel-project/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS (native ssh)
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u 'povilas1565' --password-stdin
            cd /root/HotelSiteTailwind || cd ~/HotelSiteTailwind
            docker compose pull
            docker compose up -d
            docker image prune -f
          "


