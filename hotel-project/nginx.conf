server {
    listen 80;
    server_name xn--80aanxg0a.xn-p1ai;

    root /usr/share/nginx/html;
    index index.html;

    # Сначала собираем реальные нарушения, не ломая Яндекс.Карты и TravelLine.
    # Enforce-режим включается только после анализа отчётов на боевом домене.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.tlintegration.ru https://*.tlintegration.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.tlintegration.ru https://*.tlintegration.com https://*.yandex.ru https://*.yandex.net; frame-src 'self' https://*.tlintegration.ru https://*.tlintegration.com https://rutube.ru;" always;

    # Максимальный размер загружаемых файлов (для больших видео)
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # CORS is owned by Express.  Adding `*` here would override the
        # explicit CORS_ORIGIN policy configured for the API.
    }

    # Backend загруженные файлы (изображения, видео, которые загружают пользователи)
    # ВАЖНО: это должно быть ПЕРЕД обработкой React статики!
    # Используем более специфичный regex для приоритета и поддержки видео
    location ~ ^/static/(dishes|pages|rooms|wines|videos|fallbacks)/.+\.(jpg|jpeg|png|gif|webp|svg|mp4|webm|avi|mov|wmv|flv|mkv)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ✅ КРИТИЧНО для видео: поддержка Range requests (частичная загрузка)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_cache_bypass $http_range;
        
        # Кеширование загруженных файлов (но не для Range requests)
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # CORS для медиафайлов
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, If-Range' always;
        
        # ✅ Поддержка частичного контента для видео
        add_header 'Accept-Ranges' 'bytes' always;
        
        # Безопасность
        add_header X-Content-Type-Options "nosniff" always;
        
        # Отладка
        add_header X-Served-By "backend-media" always;
        
        # OPTIONS запросы для CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range, If-Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # React статические файлы (JS, CSS, карты от сборки)
    # Это НЕ должно перехватывать медиафайлы из backend
    location /static/ {
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "react-build" always;
    }

    # Main SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.tlintegration.ru https://*.tlintegration.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.tlintegration.ru https://*.tlintegration.com https://*.yandex.ru https://*.yandex.net; frame-src 'self' https://*.tlintegration.ru https://*.tlintegration.com https://rutube.ru;" always;
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Файлы манифеста и иконки
    location ~* \.(ico|png|svg|json|txt)$ {
        try_files $uri =404;
        expires 1d;
    }

    # Запрет на доступ к служебным файлам
    location ~ /\. {
        deny all;
    }
}
