
services:

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_DB: HotelSite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2005vino2024
    ports:
    - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080


  backend:
    build:
      context: ./HotelSiteBackend  # Set the context to the directory containing the Dockerfile
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
    image: kireyd/backend:latest

    
  frontend:
    build:
      context: ./Hotel-project
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  
    depends_on:
      - backend
    image: kireyd/frontend:latest

volumes:
  postgres_data: